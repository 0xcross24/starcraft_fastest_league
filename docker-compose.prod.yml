services:
  # Laravel app
  app:
    build: .
    # Tagged by SHA during CI so it is always obvious which build a container
    # is running. Falls back to :latest for manual `docker compose` use.
    image: sfl_app:${APP_IMAGE_TAG:-latest}
    container_name: sfl_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://starcraftfastest.us
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql
      - redis
      - meilisearch

  # Nginx
  web:
    image: nginx:1.25
    container_name: sfl_nginx
    restart: unless-stopped
    ports:
      - "81:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: sfl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sfl_mysql:/var/lib/mysql
    ports:
      # Loopback-only: reachable via SSH tunnel, not from the public internet.
      - "127.0.0.1:3307:3306"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Laravel Scheduler
  scheduler:
    image: sfl_app:${APP_IMAGE_TAG:-latest}
    container_name: sfl_scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    command: sh -c "while true; do php artisan schedule:run --no-ansi >> /dev/null 2>&1; sleep 60; done"
    restart: unless-stopped

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: laravel_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    volumes:
      - meili_data:/meili_data

volumes:
  sfl_mysql:
  redis_data:
  meili_data:

