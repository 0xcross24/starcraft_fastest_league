name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the production runtime in the Dockerfile.
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate an application key
        # Generated per run rather than committed, so the repository never
        # carries a credential-shaped literal for secret scanners to flag.
        run: echo "APP_KEY=base64:$(head -c 32 /dev/urandom | base64)" >> "$GITHUB_ENV"

      - name: Run tests
        run: vendor/bin/phpunit
