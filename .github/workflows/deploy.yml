name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /srv/starcraft_fastest_league
      COMPOSE: docker compose -f /srv/starcraft_fastest_league/docker-compose.prod.yml
      APP_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Pull latest changes
        run: |
          cd "$APP_DIR"
          git reset --hard
          git clean -fd
          git pull origin main

      - name: Build the application image
        run: |
          cd "$APP_DIR"
          $COMPOSE build app
          # Keep :latest pointing at this build so a manual `docker compose up`
          # without APP_IMAGE_TAG still resolves to a real image.
          docker tag "sfl_app:${APP_IMAGE_TAG}" sfl_app:latest

      - name: Install PHP dependencies
        run: |
          cd "$APP_DIR"
          # Runs in a throwaway container so the site keeps serving the old
          # code until the new vendor tree is complete.
          $COMPOSE run --rm --no-deps app \
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Clear stale bootstrap caches
        run: |
          cd "$APP_DIR"
          # bootstrap/cache is gitignored, so git clean never removes it. A
          # manifest left over from a previous dependency set will name
          # providers that no longer exist and every request fails before
          # routing. Composer's package:discover rewrites it, but clear it
          # explicitly so a failed install cannot leave a stale one behind.
          $COMPOSE run --rm --no-deps app sh -c 'rm -f bootstrap/cache/*.php'

      - name: Apply database migrations
        run: |
          cd "$APP_DIR"
          $COMPOSE run --rm --no-deps app php artisan migrate --force

      - name: Seed build orders
        run: |
          cd "$APP_DIR"
          # Safe to repeat: the seeder only owns rows carrying a seed_key, it
          # never overwrites admin edits, and soft-deleted builds stay deleted.
          $COMPOSE run --rm --no-deps app \
            php artisan db:seed --class=BuildOrderSeeder --force

      - name: Restart services
        run: |
          cd "$APP_DIR"
          $COMPOSE up -d

      - name: Reload nginx so it re-resolves the app container
        run: |
          cd "$APP_DIR"
          # `up -d` recreates app (and scheduler, which shares the image) and
          # they can come back on different IPs. nginx resolves its FastCGI
          # upstream once at startup, so without this it keeps dialling the old
          # address and every request 502s. The resolver directive in
          # nginx/conf.d/default.conf handles this at runtime; the reload makes
          # the switch immediate and covers the case where that config is ever
          # reverted.
          $COMPOSE exec -T web nginx -s reload || $COMPOSE restart web

      - name: Verify the site responds
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://starcraftfastest.us/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "Site healthy (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying..."
            sleep 5
          done
          echo "Site did not return 200 after deploy"
          exit 1

      - name: Notify on deploy failure
        if: failure()
        run: |
          WEBHOOK="${{ secrets.DISCORD_WEBHOOK }}"
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set - skipping notification"
            exit 0
          fi
          curl -sS -m 15 -H "Content-Type: application/json" -X POST \
            -d "{\"content\":\":rotating_light: Deploy FAILED - ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$WEBHOOK"
