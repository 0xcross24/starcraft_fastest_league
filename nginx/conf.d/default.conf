server {
    listen 80;
    server_name starcraftfastest.us;

    root /var/www/html/public;

    # Batch replay uploads (20 x 2 MB, see Dockerfile uploads.ini). The 1 MB
    # default would also reject a single replay between 1 and 2 MB.
    client_max_body_size 50m;
    index index.php index.html;

    # Docker's embedded DNS. Required so the FastCGI upstream below can be
    # re-resolved at runtime instead of being cached for the life of the worker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Replays live under public/storage but are only served through the
    # download routes (login required); never hand them out as static files.
    location ^~ /storage/uploads/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        # Passing the upstream via a variable forces nginx to re-resolve it per
        # request. With a literal "fastcgi_pass app:9000" nginx resolves once at
        # startup, so a deploy that recreates the app container leaves nginx
        # dialling a stale IP and every request 502s.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }
}

